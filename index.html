<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Toko & Master Harga</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Container Modal Pengaturan Toko & Master Harga -->
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full overflow-hidden border border-slate-700">
        
        <!-- Header -->
        <div class="bg-[#0b132b] text-white p-4 px-6 flex justify-between items-center border-b border-slate-800">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-sliders text-amber-400 text-lg"></i>
                <h1 class="font-bold text-lg tracking-wide">Pengaturan Toko & Master Harga</h1>
            </div>
            <button class="text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <!-- Form Content -->
        <form id="storeSettingsForm" class="p-6 space-y-6 bg-slate-50">

            <!-- Section 1: Profil Toko (White-Label) -->
            <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm space-y-4">
                <div class="flex items-center space-x-2 text-emerald-600 font-semibold text-sm">
                    <i class="fa-solid fa-store"></i>
                    <span>Profil Toko (White-Label)</span>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Toko Bangunan</label>
                        <input type="text" id="storeName" value="TB. MAJU JAYA MAKMUR" 
                            class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Alamat & WA Toko</label>
                        <input type="text" id="storeAddress" value="Jl. Raya Bangunan No. 88 • WA: 0812-3456-789" 
                            class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
            </div>

            <!-- Section 2: Master Harga Satuan Material (Rp) -->
            <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm space-y-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-2 text-emerald-600 font-semibold text-sm">
                        <i class="fa-solid fa-tag"></i>
                        <span>Master Harga Satuan Material (Rp)</span>
                    </div>
                    
                    <!-- Tombol Tambah Data (Skenario A) -->
                    <button type="button" id="btnAddMaterial" 
                        class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-300 px-3 py-1.5 rounded-md text-xs font-bold transition flex items-center space-x-1.5 shadow-sm">
                        <i class="fa-solid fa-plus"></i>
                        <span>Tambah Material</span>
                    </button>
                </div>

                <!-- Tabel Data Material -->
                <div class="overflow-x-auto border border-slate-200 rounded-md max-h-72 overflow-y-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="bg-slate-100 text-slate-600 font-semibold text-xs border-b border-slate-200 sticky top-0 bg-slate-100">
                            <tr>
                                <th class="p-3">Material</th>
                                <th class="p-3 text-right">Harga Satuan (Rp)</th>
                                <th class="p-3 text-center w-16">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="materialTableBody" class="divide-y divide-slate-100">
                            <!-- Baris tabel di-render via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Footer Action Button -->
            <div class="flex justify-end pt-2">
                <button type="submit" 
                    class="bg-[#00a86b] hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-lg text-sm shadow-md transition flex items-center space-x-2">
                    <i class="fa-solid fa-check"></i>
                    <span>Simpan Pengaturan</span>
                </button>
            </div>

        </form>
    </div>

    <!-- Script Logic untuk Tambah, Hapus, Edit, dan Simpan -->
    <script>
        // Data awal sesuai tampilan master harga[cite: 3]
        let materials = [
            { id: 1, name: 'Hebel75', price: 650000 },
            { id: 2, name: 'Hebel100', price: 650000 },
            { id: 3, name: 'Thinbed', price: 85000 },
            { id: 4, name: 'Plester', price: 55000 },
            { id: 5, name: 'Acian', price: 65000 }
        ];

        const tbody = document.getElementById('materialTableBody');
        const btnAdd = document.getElementById('btnAddMaterial');
        const form = document.getElementById('storeSettingsForm');

        // Fungsi Render Tabel
        function renderTable() {
            tbody.innerHTML = '';
            materials.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';
                tr.innerHTML = `
                    <td class="p-2">
                        <input type="text" value="${item.name}" 
                            onchange="updateName(${index}, this.value)"
                            placeholder="Nama Material"
                            class="w-full bg-transparent px-2 py-1 rounded border border-slate-200 focus:border-emerald-500 focus:bg-white focus:outline-none font-semibold text-slate-700 text-sm">
                    </td>
                    <td class="p-2 text-right">
                        <input type="number" value="${item.price}" 
                            onchange="updatePrice(${index}, this.value)"
                            class="w-full text-right bg-slate-50 px-3 py-1 rounded-md border border-slate-300 font-bold text-slate-800 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </td>
                    <td class="p-2 text-center">
                        <button type="button" onclick="deleteMaterial(${index})" 
                            class="text-red-400 hover:text-red-600 hover:bg-red-50 p-1.5 rounded transition" title="Hapus Material">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Skenario A: Fungsi Tambah Data Material Baru
        btnAdd.addEventListener('click', () => {
            materials.push({
                id: Date.now(),
                name: 'Material Baru',
                price: 0
            });
            renderTable();
            
            // Auto scroll ke paling bawah tabel
            const tableContainer = tbody.parentElement.parentElement;
            tableContainer.scrollTop = tableContainer.scrollHeight;
        });

        // Skenario A: Fungsi Hapus Data Material
        function deleteMaterial(index) {
            const item = materials[index];
            if (confirm(`Apakah Anda yakin ingin menghapus material "${item.name}"?`)) {
                materials.splice(index, 1);
                renderTable();
            }
        }

        // Helper update data lokal saat diedit
        function updateName(index, value) {
            materials[index].name = value;
        }

        function updatePrice(index, value) {
            materials[index].price = parseFloat(value) || 0;
        }

        // Handling Submit Pengaturan
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const storeData = {
                storeName: document.getElementById('storeName').value,
                storeAddress: document.getElementById('storeAddress').value,
                materials: materials
            };

            console.log('Data Pengaturan Tersimpan:', storeData);
            alert('Pengaturan Toko & Master Harga berhasil disimpan!');
        });

        // Render awal saat halaman dimuat
        renderTable();
    </script>

</body>
</html>

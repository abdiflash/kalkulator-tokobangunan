<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Paket & Material</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .form-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .form-control {
      flex: 1;
      min-width: 150px;
      display: flex;
      flex-direction: column;
    }
    .form-control label {
      font-size: 14px;
      margin-bottom: 6px;
      color: #555;
      font-weight: 600;
    }
    .form-control input, .form-control select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .btn-container {
      display: flex;
      align-items: flex-end;
    }
    .btn-primary {
      background-color: #0d6efd;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      height: 40px;
    }
    .btn-primary:hover {
      background-color: #0b5ed7;
    }
    .btn-primary:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
      opacity: 0.7;
    }
    .btn-danger {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-danger:hover {
      background-color: #bb2d3b;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #dee2e6;
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #f8f9fa;
      color: #495057;
      font-weight: 600;
    }
    .col-no {
      width: 60px;
      text-align: center;
    }
    .col-action {
      width: 100px;
      text-align: center;
    }
    .empty-state {
      text-align: center;
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Manajemen Item Material</h2>

    <!-- Form Input Material -->
    <div class="form-group">
      <div class="form-control">
        <label for="materialName">Item Material</label>
        <input type="text" id="materialName" placeholder="Contoh: Semen Portland">
      </div>
      <div class="form-control">
        <label for="quantity">Jumlah</label>
        <input type="number" id="quantity" placeholder="10" min="1">
      </div>
      <div class="form-control">
        <label for="unit">Satuan</label>
        <select id="unit">
          <option value="Sak">Sak</option>
          <option value="Pcs">Pcs</option>
          <option value="Kg">Kg</option>
          <option value="Meter">Meter</option>
          <option value="Batang">Batang</option>
        </select>
      </div>
      <div class="btn-container">
        <!-- Tombol Tambahkan Paket dengan pencegahan multi-klik -->
        <button id="btnTambahPaket" class="btn-primary" onclick="handleAddPackage()">
          Tambahkan Paket
        </button>
      </div>
    </div>

    <!-- Tabel Data Material -->
    <table>
      <thead>
        <tr>
          <!-- Kolom No. berada di sebelah kiri kolom Item Material -->
          <th class="col-no">No.</th>
          <th>Item Material</th>
          <th>Jumlah</th>
          <th>Satuan</th>
          <th class="col-action">Aksi</th>
        </tr>
      </thead>
      <tbody id="materialTableBody">
        <!-- Baris data dirender secara dinamis melalui JavaScript -->
      </tbody>
    </table>
  </div>

  <script>
    // Data awal (Dummy Data)
    let materials = [
      { id: 1, name: "Semen Portland 50kg", quantity: 20, unit: "Sak" },
      { id: 2, name: "Besi Beton 10mm", quantity: 50, unit: "Batang" }
    ];

    // Referensi Elemen DOM
    const btnTambah = document.getElementById('btnTambahPaket');
    const tableBody = document.getElementById('materialTableBody');
    const inputName = document.getElementById('materialName');
    const inputQty = document.getElementById('quantity');
    const inputUnit = document.getElementById('unit');

    // Fungsi untuk merender ulang tabel
    function renderTable() {
      tableBody.innerHTML = '';

      if (materials.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="5" class="empty-state">Belum ada data material.</td>
          </tr>
        `;
        return;
      }

      materials.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="col-no">${index + 1}</td>
          <td>${escapeHtml(item.name)}</td>
          <td>${item.quantity}</td>
          <td>${item.unit}</td>
          <td class="col-action">
            <button class="btn-danger" onclick="deleteItem(${item.id})">Hapus</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    // Fungsi Tambah Paket (Mencegah Klik Berganda saat Proses Asinkron)
    async function handleAddPackage() {
      const name = inputName.value.trim();
      const qty = parseInt(inputQty.value, 10);
      const unit = inputUnit.value;

      if (!name || isNaN(qty) || qty <= 0) {
        alert('Mohon isi nama material dan jumlah dengan benar!');
        return;
      }

      // 1. Dinonaktifkan tombol untuk cegah multi-klik
      btnTambah.disabled = true;
      btnTambah.textContent = 'Memproses...';

      try {
        // Simulasi request API / penanganan asynchronous (delay 1 detik)
        await new Promise(resolve => setTimeout(resolve, 1000));

        // 2. Tambahkan data baru
        const newItem = {
          id: Date.now(),
          name: name,
          quantity: qty,
          unit: unit
        };
        materials.push(newItem);

        // 3. Reset form dan render ulang tabel
        inputName.value = '';
        inputQty.value = '';
        renderTable();
      } catch (error) {
        alert('Gagal menambahkan paket. Silakan coba lagi.');
      } finally {
        // 4. Mengembalikan tombol ke keadaan semula
        btnTambah.disabled = false;
        btnTambah.textContent = 'Tambahkan Paket';
      }
    }

    // Fungsi untuk menghapus item
    function deleteItem(id) {
      materials = materials.filter(item => item.id !== id);
      renderTable();
    }

    // Mencegah XSS pada input teks
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Jalankan render tabel saat halaman pertama kali dimuat
    renderTable();
  </script>
</body>
</html>
